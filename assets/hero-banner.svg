  <g transform="translate(1320 552) scale(0.667)" color="#E0A87E" stroke-width="2.25" opacity="0.8">
    <use href="#cloop"></use>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="400" text-anchor="middle">
    <g font-size="23" letter-spacing="2" opacity="0.95">
      <text x="780" y="62" fill="#4ECDC4" text-anchor="end">ONE FEEDBACK LOOP</text>
      <circle cx="800" cy="56" r="6" fill="#B794F6" opacity="0.5" filter="url(#softGlow)"></circle>
      <circle cx="800" cy="56" r="2.4" fill="#EDE3FF"></circle>
      <text x="820" y="62" fill="#B794F6" text-anchor="start">THREE SCALES</text>
    </g>
    <g font-size="23" fill="#E8E6F0" opacity="0.78">
      <text x="800" y="100">Every zone runs the same loop: measure the state, decide what to do, act, then measure again.</text>
      <text x="800" y="130" opacity="0.72">A qubit held on course by pulse feedback, agents passing state around a graph,</text>
      <text x="800" y="160" opacity="0.72">a cluster routing around a dead pod — one pattern, three scales.</text>
    </g>
    <g font-size="20" letter-spacing="2">
      <text x="280" y="622" fill="#4ECDC4" opacity="0.85">QUANTUM CONTROL</text>
      <text x="800" y="622" fill="#B794F6" opacity="0.9">AGENT ORCHESTRATION</text>
      <text x="1320" y="622" fill="#E0A87E" opacity="0.95">DISTRIBUTED SYSTEMS</text>
    </g>
    <g font-size="19">
      <text x="280" y="655" fill="#4ECDC4" opacity="0.72">Steering one qubit with shaped microwave pulses,</text>
      <text x="280" y="683" fill="#4ECDC4" opacity="0.72">corrected from its own measured state.</text>
      <text x="800" y="655" fill="#B794F6" opacity="0.78">Routing state between LLM agents and tools,</text>
      <text x="800" y="683" fill="#B794F6" opacity="0.78">re-planning each hop from the last result.</text>
      <text x="1320" y="655" fill="#E0A87E" opacity="0.85">Watching pods across a cluster, detecting</text>
      <text x="1320" y="683" fill="#E0A87E" opacity="0.85">failure and rerouting before anyone notices.</text>
      <text x="800" y="726" fill="#6FA8FF" opacity="0.85">The line threading all three diagrams is that loop's signal path: a pulse travels it as control hands off from one scale to the next.</text>
    </g>

    <g font-size="18" letter-spacing="1">
      <text x="434" y="262" fill="#4ECDC4" opacity="0">|ψ⟩<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.86;0.9;0.97;1" values="0;0;0.4;0.4;0"></animate></text>
      <text x="800" y="562" font-size="21" fill="#B794F6" opacity="0">state → state<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.03;0.07;0.5;0.54;1" values="0;0;0.4;0.4;0;0"></animate></text>
      <text x="1320" y="198" font-size="21" fill="#FF6B6B" opacity="0">node failure → reroute<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.5615;0.59;0.8125;0.84;1" values="0;0;0.4;0.4;0;0"></animate></text>
    </g>
  </g>
</svg>
