    <polygon points="1345,350 1332.5,371.65 1307.5,371.65 1295,350 1307.5,328.35 1332.5,328.35"></polygon>
    <polygon points="1382.5,328.35 1370,350 1345,350 1332.5,328.35 1345,306.7 1370,306.7"></polygon>
