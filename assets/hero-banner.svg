      <animate attributeName="fill-opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.5625;0.6;0.64;0.68;0.72;0.76;0.8125;1" values="0.1;0.1;0.22;0.08;0.24;0.09;0.2;0.1;0.1"></animate>
    </polygon>
  </g>

  <path id="reroute" d="M 1282.5 328.35 Q 1320 252 1357.5 328.35" fill="none" stroke="#FF6B6B" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.5"></path>
  <circle r="1.75" fill="#FF6B6B" opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.5615;0.5625;0.8125;0.8135;1" values="0;0;1;1;0;0"></animate>
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5625;0.8125;1" keyPoints="0;0;1;1" keySplines="0 0 1 1;0.42 0 0.58 1;0 0 1 1">
      <mpath href="#reroute"></mpath>
    </animateMotion>
  </circle>
